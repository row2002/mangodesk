name: Feature request
description: Suggest something MangoDesk should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: How you imagine it working in MangoDesk.
  - type: textarea
    id: others
    attributes:
      label: How do Studio 3T, Compass or mongosh handle it?
      description: Optional, but it helps to see what people are used to.
